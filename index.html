<!DOCTYPE html>
<html lang="en">
  <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width,initial-scale=1.0">
   <link rel="stylesheet" href="analyzer.css">
   <title>Student Performance Analyzer</title>
  </head>
  <body>
    <h1 id="heading">Student Performance Analyzer</h1>
    <div id="inputs">
      Name:<input type="text" id="names" placeholder="Enter Name:"><br>
      Marks:<input type="Number" id="marks" placeholder="Enter Marks:">
      <button id="add">Add</button>
    </div>
    <div id="buttons">
      <button id="allStudents">All Students</button>
      <button id="passedStudents">Passed Students</button>
      <button id="below40">Students Below 40</button>
      <button id="highScorers">High Scorers</button>
      <button id="topStudent">Top Student</button>
      <button id="statistics">Statistics</button>
    </div>
    <div id="result"></div>
    <script src="analyzer.js"></script>
  </body>
</html>
